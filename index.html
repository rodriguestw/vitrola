<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrola</title>
    <!-- css -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vitrola.css">
    <link rel="stylesheet" href="css/playlist.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/disco.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- js -->
    <link rel="stylesheet" href="js/app.js">
    <link rel="stylesheet" href="js/audio.js">
    <link rel="stylesheet" href="js/drag.js">
    <link rel="stylesheet" href="js/effects.js">
    <link rel="stylesheet" href="js/playlist.js">
    <link rel="stylesheet" href="js/tonearm.js">
    <link rel="stylesheet" href="js/turntable.js">

    


</head>
<body>

<div class="app">

    <aside class="playlist">
        <!-- Discos -->

        <div class="disc">

    <img class="cover" src="assets/img/calabreso-jackson.png" alt="Calabreso Jackson">

    <span>

        Calabreso Jackson

    </span>

</div>

    <!-- vtrola -->

    <div class="turntable">

    <div class="platter">

        <div class="record">

            <div class="label"></div>

        </div>

    </div>

    <div class="tonearm"></div>

</div>

    </aside>


    <main class="turntable">

        <!-- prato -->

        <div class="platter">

            <div class="record"></div>

        </div>


        <!-- braço -->

        <div class="tonearm">

            <div class="arm"></div>

        </div>


        <!-- botões -->

        <div class="controls">

            <button id="power">
                ON
            </button>

            <button id="eject">
                Ejetar
            </button>

        </div>

    </main>

</div>

<audio id="audio"></audio>

<script src="js/app.js"></script>

</body>
</html>
